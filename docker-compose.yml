services:
  postgres:
    # Optional local database. Production/demo hosting uses Supabase with the same schema.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: vidyutone
      POSTGRES_PASSWORD: vidyutone
      POSTGRES_DB: vidyutone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://vidyutone:vidyutone@postgres:5432/vidyutone
      SECRET_KEY: dev-only-change-me
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATA_DIR: /data
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
    volumes:
      - ./backend/app:/app/app
      - ./data:/data
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8001
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
